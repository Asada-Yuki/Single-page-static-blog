name = "single-timeline-blog-publisher"
main = "src/index.js"
compatibility_date = "2026-09-27"
workers_dev = true

[[routes]]
pattern = "www.yuki.art/write*"
zone_name = "yuki.art"

[[routes]]
pattern = "www.yuki.art/api/*"
zone_name = "yuki.art"

[[routes]]
pattern = "yuki.art/write*"
zone_name = "yuki.art"

[[routes]]
pattern = "yuki.art/api/*"
zone_name = "yuki.art"

[vars]
GITHUB_OWNER = "Asada-Yuki"
GITHUB_REPO = "Single-page-static-blog"
GITHUB_BRANCH = "main"

[[ratelimits]]
name = "AUTHOR_LOGIN_LIMITER"
namespace_id = "917203641"

  [ratelimits.simple]
  limit = 10
  period = 60

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
