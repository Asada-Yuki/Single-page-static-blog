<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Write</title>
    <link rel="stylesheet" href="/write.css">
    <script type="module" src="/write.js"></script>
  </head>
  <body>
    <main class="write-shell">
      <p id="startup-status" class="status" role="status">Opening the writer… If this takes too long, reload to retry.</p>
      <noscript><p>This writer needs JavaScript to save drafts and publish. Enable JavaScript and reload. Published posts remain readable.</p></noscript>
      <form id="login-view" class="login-view" hidden>
        <label class="key-label" for="author-key">Author key</label>
        <input id="author-key" name="author-key" type="password" autocomplete="current-password" minlength="32" maxlength="256" required>
        <button id="login-button" class="plain-button" type="submit">Open</button>
        <p id="login-status" class="status" role="status" aria-live="polite"></p>
      </form>

      <section id="composer-view" class="composer-view" hidden>
        <form id="editor-form">
          <label class="visually-hidden" for="post-body">Write something</label>
          <textarea id="post-body" name="post-body" maxlength="100000" aria-describedby="editor-hint draft-note" placeholder="Write something…" spellcheck="true"></textarea>
          <div id="attachments" class="attachments" hidden></div>
          <div class="toolbar">
            <button id="photo-button" class="plain-button" type="button">Photo</button>
            <input id="image-input" class="visually-hidden" type="file" accept="image/*" multiple tabindex="-1">
            <button id="publish-button" class="plain-button" type="submit">Publish</button>
          </div>
        </form>
        <p id="editor-hint" class="editor-note">Use ⌘/Ctrl+Enter to publish. Posts appear on the public timeline.</p>
        <div class="editor-footer">
          <p id="draft-note" class="editor-note">Opening local draft storage…</p>
          <button id="clear-draft-button" class="logout-button clear-draft-button" type="button">Clear draft</button>
        </div>
        <p id="publish-status" class="status" role="status" aria-live="polite"></p>
        <button id="recover-published-button" class="logout-button" type="button" hidden>Restore last submitted content</button>
        <button id="logout-button" class="logout-button" type="button" hidden>Sign out</button>
      </section>
    </main>
  </body>
</html>
