<!doctype html>
<html lang="{{SITE_LANG}}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <script data-cfasync="false" src="/theme.js?v={{THEME_VERSION}}"></script>
    <meta name="description" content="{{PAGE_DESCRIPTION}}">
    <link rel="canonical" href="{{CANONICAL_URL}}">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="alternate" type="application/rss+xml" title="{{SITE_NAME}} RSS" href="/feed.xml">
    <meta property="og:type" content="{{OG_TYPE}}">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:site_name" content="{{SITE_NAME}}">
    <meta property="og:title" content="{{OG_TITLE}}">
    <meta property="og:description" content="{{OG_DESCRIPTION}}">
    <meta property="og:url" content="{{OG_URL}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta property="og:image:alt" content="{{OG_IMAGE_ALT}}">
    <meta name="twitter:card" content="{{TWITTER_CARD}}">
    <meta name="twitter:title" content="{{TWITTER_TITLE}}">
    <meta name="twitter:description" content="{{TWITTER_DESCRIPTION}}">
    <meta name="twitter:image" content="{{TWITTER_IMAGE}}">
    <meta name="twitter:image:alt" content="{{TWITTER_IMAGE_ALT}}">
    {{ARTICLE_META}}
    {{STRUCTURED_DATA}}
    <title>{{PAGE_TITLE}}</title>
    <link rel="stylesheet" href="/style.css?v={{STYLE_VERSION}}">
  </head>
  <body class="{{BODY_CLASS}}" data-initial-entry="{{INITIAL_ENTRY_ID}}" data-timeline-index="{{TIMELINE_INDEX}}">
    <a class="skip-link" href="#timeline-content">跳到内容</a>
    {{QUICK_BROWSE}}
    <main class="timeline-shell" id="timeline-content">
      <header class="site-header" id="top">
        <h1 class="visually-hidden">{{SITE_NAME}} · 个人时间流</h1>
        <img class="site-logo" src="/logo.svg" alt="" width="678" height="72" fetchpriority="high">
        <button class="theme-toggle" data-theme-toggle type="button" aria-label="深色模式" aria-pressed="false" title="切换到深色模式">
          <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.6 8.6 0 1 0 20.2 15.1Z" /></svg>
          <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" /></svg>
        </button>
      </header>
      <div class="timeline" aria-busy="false">
        {{TIMELINE}}
      </div>
      {{CONTEXT_LINKS}}
      <footer class="site-footer" aria-label="站点信息">
        <span>© {{YEAR}} {{SITE_NAME}}</span>
        <span>时间均为 UTC</span>
        <a href="/feed.xml">RSS</a>
        <a href="/about/">关于</a>
        <a href="#top">↑ 回到顶部</a>
      </footer>
    </main>
    <p class="share-status" data-share-status role="status" aria-live="polite" hidden></p>
    <dialog class="image-viewer" aria-label="图片查看器">
      <div class="image-viewer__topbar">
        <span class="image-viewer__count" aria-live="polite"></span>
        <button class="image-viewer__button image-viewer__close" type="button" aria-label="关闭图片">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <button class="image-viewer__button image-viewer__previous" type="button" aria-label="上一张">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
      </button>
      <div class="image-viewer__stage">
        <img class="image-viewer__image" alt="">
      </div>
      <p class="image-viewer__status" role="status" hidden></p>
      <button class="image-viewer__button image-viewer__next" type="button" aria-label="下一张">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
      </button>
    </dialog>
    <script data-cfasync="false" type="module" src="/image-viewer.js?v={{IMAGE_VIEWER_VERSION}}"></script>
    <script data-cfasync="false" type="module" src="/quick-browse.js?v={{QUICK_BROWSE_VERSION}}"></script>
    <script data-cfasync="false" type="module" src="/post-sharing.js?v={{POST_SHARING_VERSION}}"></script>
  </body>
</html>
